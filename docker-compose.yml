version: '3.8'

# WHICH FILE IS ON THE BOX — measured 8 September 2026, not assumed.
# `GET https://35.224.126.225.nip.io/rest/settings` on the live VM returns
# `executionMode: "queue"`, concurrency 2. Only THIS file sets EXECUTIONS_MODE=queue
# and ships an n8n-worker plus redis; docker-compose.single.yml says in its own
# comments that it deliberately runs in the default "regular" mode. So the box is
# running this file, or something derived from it — NOT the single-container one,
# whatever docs/J1-RUN-CHECKLIST.md's `-f docker-compose.single.yml` line implies.
# That checklist line is older than the queue-mode switch and has not been
# re-verified. Nobody has read /opt/nexus from this repo; the reasoning above is
# the whole basis. Settle it with `docker compose ps` on the VM before relying on
# it either way.
#
# CONSEQUENCE THAT COSTS REAL TIME: in queue mode the WORKER executes workflows,
# so `docker compose up -d n8n` recreates the process that does NOT read
# $env inside a Code node. A changed secret in .env then appears correct in the
# main container's `printenv` and is still stale where it is actually used. This
# is exactly how the WAHA gate sat at `header_present: true, ok: false` on 8 Sep.
# Recreate n8n AND n8n-worker, and verify the worker:
#   docker compose exec -T n8n-worker sh -c 'printf %s "$WAHA_WEBHOOK_SECRET" | sha256sum'
#
# Both compose files share the same named volumes, so only ONE may run at a time.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    env_file: .env
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=https://35.224.126.225.nip.io/
      - N8N_EDITOR_BASE_URL=https://35.224.126.225.nip.io/
      - GENERIC_TIMEZONE=UTC

      # --- Identity keys: MUST be pinned and identical on n8n + n8n-worker ---
      # Without these n8n regenerates them on every restart, which invalidates
      # every browser session and every API token (the "Unauthorized" /
      # "invalid signature" loop). Values live in .env.
      # NOTE: `environment:` overrides `env_file:`, so they are set explicitly
      # here rather than relying on .env being picked up implicitly.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}

      # Allow workflows to read process env vars via {{ $env.NAME }}.
      # Newer n8n blocks this by default ("access to env vars denied"), which
      # forces secrets to be hardcoded into workflow JSON. Keeping it open lets
      # the Bitrix24 webhook URL and WAHA key live only in .env.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # Bitrix24 CRM inbound webhook (used by wf_108 ERP Sync)
      - BITRIX24_WEBHOOK_URL=${BITRIX24_WEBHOOK_URL}
      - BITRIX24_DOMAIN=${BITRIX24_DOMAIN}
      - WAHA_API_KEY=${WAHA_API_KEY}

      # Keep execution history from growing unbounded (273 failed runs piled up
      # in a single afternoon during the WhatsApp loop incident).
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000

      # n8n's OWN internal metadata DB (users, credentials, workflows, executions).
      # This is NOT the business database — Supabase (cloud) stays the single source
      # of truth for leads/inventory/etc. This is purely n8n's engine-internal storage,
      # required because SQLite cannot safely be shared between the n8n + n8n-worker
      # processes (that mismatch was corrupting data and wiping the owner account).
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_local_pw

      # Google OAuth2 — Gmail credential
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # Queue setup (using Redis)
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
    depends_on:

      redis:
        condition: service_healthy
      n8n-db:
        condition: service_healthy
    networks:
      - nexus_net
    volumes:
      - n8n_data:/home/node/.n8n
    deploy:
      resources:
        limits:
          # Raised from 1G: the AI-agent workflows push large payloads through
          # the main process, and hitting the cap got the container OOM-killed,
          # which `restart: always` then bounced -> logged-out sessions.
          memory: 3G

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-worker
    restart: always
    env_file: .env
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_local_pw
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY}

      # The worker is what actually runs Code nodes in queue mode, so these
      # must match the main service or expressions resolve differently there.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - BITRIX24_WEBHOOK_URL=${BITRIX24_WEBHOOK_URL}
      - BITRIX24_DOMAIN=${BITRIX24_DOMAIN}
      - WAHA_API_KEY=${WAHA_API_KEY}

      # Must be byte-identical to the main n8n service, otherwise the worker
      # cannot decrypt credentials and tokens signed by main are rejected.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      n8n-db:
        condition: service_healthy
    networks:
      - nexus_net
    volumes:
      - n8n_data:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 1G

  # n8n's dedicated internal Postgres — NOT the app's business database.
  # Free, self-hosted, local only. Supabase (cloud) remains untouched and
  # is still where all leads/inventory/CRM data lives.
  n8n-db:
    image: postgres:16-alpine
    container_name: n8n-db
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_local_pw
      - POSTGRES_DB=n8n
    networks:
      - nexus_net
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - WAHA_PRINT_QR=True
      - WAHA_LOG_LEVEL=info
      # GOWS (Go-based) engine. NOWEB has a known bug in these builds where a
      # session sits on STARTING forever and never reaches SCAN_QR_CODE, so the
      # QR can never be shown -- reproduced here on WAHA 2026.7.1.
      # See github.com/devlikeapro/waha issues #1495 / #2006.
      # Changing engine invalidates any existing session, so a QR re-scan is
      # required once after this switch.
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
    networks:
      - nexus_net
    volumes:
      # WAHA stores linked-device session data in /app/.sessions, NOT /app/.waha.
      # The old mount meant the WhatsApp login was never actually persisted, so
      # every `docker compose up -d` silently killed the session and any send
      # failed with: Session "default" does not exist.
      - waha_sessions:/app/.sessions
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - nexus_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  nexus_net:
    driver: bridge

volumes:
  n8n_data:
  n8n_db_data:
  redis_data:
  waha_sessions:
