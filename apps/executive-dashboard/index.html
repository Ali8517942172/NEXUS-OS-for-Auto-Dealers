<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
</head>
<body>

<!--
  This file is a shell, deliberately. Every screen is rendered by app.js from
  live data. The previous version carried hardcoded rows and KPI deltas in the
  markup, which is how a beautiful dashboard ended up displaying invented leads.
  If a value is not in this file, it cannot be faked here.
-->

<div id="boot" class="login-wrap"></div>

<div id="app" class="app hide">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div class="brand-name">NEXUS OS</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="userInitials">—</div>
        <div style="min-width:0;flex:1">
          <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="userName">—</div>
          <div class="cell-sub" id="userRole">—</div>
        </div>
        <button class="btn ghost sm" id="signOutBtn" title="Sign out" aria-label="Sign out">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Overview</h1>
      <div class="topbar-spacer"></div>
      <div id="connState" class="pill"><span class="dot"></span>Checking…</div>
      <button class="btn ghost sm" id="refreshBtn" title="Refresh" aria-label="Refresh">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </header>
    <div id="subBanner" class="hide" style="margin:14px 20px 0"></div>
    <main class="content" id="screen" role="main"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail panel"></aside>

<script type="module" src="/app.js"></script>
</body>
</html>
