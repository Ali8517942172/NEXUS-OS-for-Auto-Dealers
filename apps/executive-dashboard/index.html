<!DOCTYPE html>
<html lang="en" class="nx-tw">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
</head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased">

<!--
  This file is a shell, deliberately. Every screen is rendered by app.js from
  live data. The previous version carried hardcoded rows and KPI deltas in the
  markup, which is how a beautiful dashboard ended up displaying invented leads.
  If a value is not in this file, it cannot be faked here.

  The shell's layout and classes are the Google Stitch app-shell designs
  (design/stitch/app-shell-*.html, 7 Oct 2026). `nx-tw` on <html> is the scope
  every Tailwind utility compiles under; `nx-stitch` marks the regions that get
  the scoped reset in lib/stitch.css. Every name, count and status in the shell
  is filled in by lib/nav.js and lib/shell.js from live reads — the Stitch
  mock's names and numbers are not here.
-->

<div id="boot" class="nx-stitch"></div>

<div id="app" class="hide">
  <aside class="nx-stitch fixed left-0 top-0 h-screen w-72 bg-inverse-surface text-inverse-on-surface z-50 flex flex-col justify-between overflow-y-auto shadow-[0_1px_8px_rgba(0,0,0,0.04)]" aria-label="Navigation">
    <div class="flex flex-col">
      <div class="h-14 px-space-lg flex items-center justify-between bg-inverse-surface shrink-0">
        <div class="flex items-center gap-space-sm">
          <div class="w-7 h-7 rounded bg-primary-container flex items-center justify-center text-on-primary font-headline-md text-headline-md">N</div>
          <div class="flex items-center gap-space-xs">
            <span class="font-headline-md text-headline-md tracking-tight text-surface-container-lowest font-bold">NEXUS</span>
            <span class="font-label-numeric-sm text-label-numeric-sm text-tertiary-fixed-dim uppercase tracking-wider">OS</span>
          </div>
        </div>
      </div>
      <nav class="flex flex-col px-space-sm py-space-xs space-y-space-md" id="nav" aria-label="Screens"></nav>
    </div>
    <div class="p-space-sm bg-inverse-surface mt-space-md">
      <div class="flex flex-col space-y-0.5 mb-space-sm" id="navBottom"></div>
      <div class="px-space-sm py-space-xs rounded bg-surface-container-high/10 text-outline-variant mb-space-sm">
        <div class="font-table-header text-table-header uppercase text-outline mb-1 tracking-wider">What the marks mean</div>
        <div class="grid grid-cols-2 gap-1 font-label-numeric-sm text-table-header">
          <span class="flex items-center gap-1"><span>◐</span> Partial</span>
          <span class="flex items-center gap-1"><span>○</span> Coming soon</span>
          <span class="flex items-center gap-1"><span>◇</span> Planned</span>
        </div>
      </div>
      <div class="flex items-center justify-between gap-space-sm px-space-sm py-1.5 rounded-lg text-inverse-on-surface">
        <div class="flex items-center gap-space-sm min-w-0">
          <div class="w-7 h-7 rounded-full bg-primary-container flex items-center justify-center text-on-primary font-label-numeric-sm text-label-numeric-sm font-semibold shrink-0" id="userInitials">—</div>
          <span class="font-body-sm text-body-sm truncate" id="sideUserName">—</span>
        </div>
        <button class="p-1.5 rounded-lg hover:bg-surface-variant hover:text-on-surface transition-colors" id="signOutBtn" type="button" title="Sign out" aria-label="Sign out">
          <span class="material-symbols-outlined text-[18px]">logout</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="pl-72">
    <header class="nx-stitch fixed top-0 left-72 right-0 h-14 bg-surface-container-lowest z-40 flex items-center justify-between px-space-lg shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
      <div class="flex items-center gap-space-sm text-on-surface-variant min-w-0">
        <div class="flex items-center gap-1.5 font-body-sm text-body-sm min-w-0">
          <span class="font-semibold text-on-surface truncate min-w-[3rem] max-w-[12rem]" id="crumbTenant">Checking account…</span>
          <span class="text-outline-variant">/</span>
          <span class="text-on-surface-variant whitespace-nowrap" id="crumbGroup">—</span>
          <span class="text-outline-variant">/</span>
          <span class="text-primary font-medium whitespace-nowrap" id="pageTitle">—</span>
        </div>
      </div>
      <div class="flex-1 min-w-[8rem] max-w-md mx-space-md">
        <div class="relative flex items-center w-full">
          <span class="material-symbols-outlined absolute left-3 text-outline text-[18px]">search</span>
          <input class="w-full pl-9 pr-14 py-1.5 rounded-lg bg-surface-container-low text-on-surface placeholder:text-outline font-body-sm text-body-sm focus:outline-none focus:bg-surface-container-lowest" id="globalSearch" placeholder="Search or ask NEXUS" type="text" readonly aria-label="Search or ask NEXUS (Ctrl K)" />
          <span class="absolute right-2.5 font-label-numeric-sm text-table-header px-1.5 py-0.5 rounded bg-surface-container text-outline font-medium">Ctrl K</span>
        </div>
      </div>
      <div class="flex items-center gap-space-sm shrink-0">
        <button class="flex items-center gap-1.5 px-space-sm py-1 rounded bg-surface-container-low text-on-surface-variant font-label-numeric-sm text-label-numeric-sm" id="refreshBtn" type="button" title="Refresh this screen">
          <span class="w-2 h-2 rounded-full bg-outline"></span><span>Loading…</span>
        </button>
        <div class="relative">
          <button class="flex items-center gap-1 px-1.5 py-0.5 rounded bg-surface-container-low text-on-surface-variant font-label-numeric-sm text-table-header" id="healthBtn" type="button" aria-expanded="false" aria-controls="healthPop" title="System health">
            <span class="w-2 h-2 rounded-full bg-outline"></span><span class="font-medium">Checking…</span>
          </button>
        </div>
        <div class="relative">
          <button class="flex items-center gap-1.5 px-space-sm py-1 rounded-lg bg-surface-container-low hover:bg-surface-container font-body-sm text-body-sm text-on-surface transition-colors" id="scopeBtn" type="button" aria-expanded="false" aria-controls="scopeMenu">
            <span class="font-medium truncate max-w-[12rem]" id="scopeLabel">Checking account…</span>
            <span class="material-symbols-outlined text-[16px] text-outline">arrow_drop_down</span>
          </button>
          <div class="hide absolute top-10 right-0 w-80 bg-surface-container-lowest rounded-xl shadow-2xl p-0 z-50 flex flex-col overflow-hidden" id="scopeMenu" role="menu">
            <div class="px-4 py-3 bg-surface-container-low flex items-center justify-between">
              <span class="font-label-numeric-sm text-table-header text-outline tracking-wider font-semibold uppercase">Dealership scope</span>
            </div>
            <div class="p-2 space-y-1">
              <div id="scopeMenuBody"></div>
              <div class="h-px bg-surface-container my-1"></div>
              <div class="group flex items-start gap-2.5 p-2.5 rounded-lg opacity-60 bg-surface-container-low cursor-not-allowed relative" title="Viewing several rooftops together is on the roadmap. It is not a control in this build.">
                <div class="mt-0.5 w-4 h-4 rounded-full bg-surface-container flex items-center justify-center text-outline flex-shrink-0">
                  <span class="material-symbols-outlined text-[12px] text-outline">lock</span>
                </div>
                <div class="flex flex-col flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-body-sm text-body-sm font-medium text-outline truncate">All rooftops</span>
                    <span class="font-label-numeric-sm text-table-header px-1 rounded bg-surface-container text-outline uppercase font-semibold whitespace-nowrap">○ COMING SOON</span>
                  </div>
                  <span class="font-body-sm text-table-header text-outline-variant mt-0.5 truncate">One dealership at a time in this build</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-space-xs text-on-surface-variant">
          <button class="p-1.5 rounded-lg hover:bg-surface-container-low hover:text-on-surface transition-colors" id="privacyBtn" title="Masks customer names, phones and emails, for screen sharing" type="button" aria-pressed="false" data-privacy-exempt>
            <span class="material-symbols-outlined text-[20px]">visibility</span><span class="privacy-label sr-only">Privacy mode</span>
          </button>
          <button aria-label="Notifications" class="p-1.5 rounded-lg hover:bg-surface-container-low hover:text-on-surface transition-colors relative" id="bellBtn" type="button" aria-expanded="false" aria-controls="notifDrawer">
            <span class="material-symbols-outlined text-[20px]">notifications</span>
            <span class="hide absolute top-1 right-1 w-4 h-4 bg-error text-on-error font-label-numeric-sm text-[10px] font-bold rounded-full flex items-center justify-center" id="bellCount"></span>
          </button>
          <button aria-label="Keyboard shortcuts" class="p-1.5 rounded-lg hover:bg-surface-container-low hover:text-on-surface transition-colors" id="helpBtn" type="button" title="Keyboard shortcuts (?)">
            <span class="material-symbols-outlined text-[20px]">help</span>
          </button>
        </div>
        <div class="flex items-center gap-space-sm pl-space-sm">
          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary font-headline-md text-headline-md">
            <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
          </div>
          <div class="flex flex-col text-left">
            <span class="font-body-sm text-body-sm font-semibold text-on-surface leading-tight truncate max-w-[10rem]" id="userName">—</span>
            <span class="font-label-numeric-sm text-table-header text-outline uppercase whitespace-nowrap truncate max-w-[10rem]" id="userRole">—</span>
          </div>
        </div>
      </div>
    </header>

    <div class="pt-14">
      <div id="subBanner" class="hide" style="margin:14px 20px 0"></div>
      <main class="content relative min-h-screen bg-background w-full max-w-none px-space-lg py-space-lg" id="screen" role="main"></main>
    </div>
  </div>
</div>

<!-- System health popover (app-shell-system-health-popover-active--cb7e59). -->
<div class="nx-stitch hide fixed top-14 right-72 z-50 w-full max-w-sm pointer-events-auto" id="healthPop" role="dialog" aria-label="System health"></div>

<!-- Notifications slide-over (app-shell-notifications-drawer-active--ef7a40). -->
<div class="nx-stitch hide fixed inset-0 top-14 left-72 bg-on-surface/30 backdrop-blur-[2px] z-40" id="notifScrim"></div>
<aside class="nx-stitch hide fixed right-0 top-14 bottom-0 w-[440px] max-w-full bg-surface-container-lowest z-50 shadow-2xl flex flex-col overflow-hidden" id="notifDrawer" role="dialog" aria-label="Notifications"></aside>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail panel"></aside>

<script type="module" src="/app.js"></script>
</body>
</html>
