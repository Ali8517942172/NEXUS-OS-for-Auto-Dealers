<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>NEXUS Founder Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
</head>
<body>

<!--
  The NEXUS founder console, deliberately a separate page from the dealer app
  (../index.html). Nothing here is reachable from the dealer app's navigation,
  and the dealer app's bundle does not contain this page's code. The server-side
  nexus_founder_* RPCs refuse any account that is not the platform admin; the
  gate in founder/app.js only decides what is drawn.
-->

<div id="boot" class="login-wrap"></div>

<div id="app" class="app hide">
  <div class="main">
    <header class="topbar">
      <div class="brand-mark">N</div>
      <h1 id="pageTitle">Founder Console</h1>
      <div class="topbar-spacer"></div>
      <span class="cell-sub" id="userName">—</span>
      <a class="btn ghost sm" href="/" title="Back to the dashboard">Dashboard</a>
      <button class="btn ghost sm" id="refreshBtn" title="Refresh" aria-label="Refresh">
        <span class="material-symbols-outlined">refresh</span>
      </button>
      <button class="btn ghost sm" id="signOutBtn" title="Sign out" aria-label="Sign out">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </header>
    <main class="content" id="screen" role="main"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail panel"></aside>

<script type="module" src="/founder/app.js"></script>
</body>
</html>
