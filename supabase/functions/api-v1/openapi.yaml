                source: api
                vehicle_interest: Nissan Patrol 2025
                budget_aed: 280000
                status: HOT
                ai_score: 86
                scoring_state: SCORED
                assigned_to_id: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
                assigned_to: Omar Haddad
                external_id: CDK-LEAD-884213
                created_at: '2026-09-21T09:40:00Z'
                updated_at: '2026-09-21T09:41:12Z'
      responses:
        2XX:
          description: Acknowledge within 10 seconds
