components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: nxk_live_ + 40 hex
      description: A NEXUS API key from Settings → API.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` from the previous page. Opaque.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, malformed or revoked key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: This API key is not valid, has been revoked, or its dealership is inactive.
    Forbidden:
      description: Key lacks the scope, or the dealership is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: insufficient_scope
              message: This API key lacks the leads:write scope.
    NotFound:
      description: Not found at this dealership
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: No such lead.
    Invalid:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_phone
              message: phone must be an E.164 number such as +971501234567.
    RateLimited:
      description: Over 120 requests in the current minute
      headers:
        Retry-After:
          schema:
            type: integer
          example: 23
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: More than 120 requests in a minute. Retry after the Retry-After header.
  examples:
    Lead:
      value:
        id: 1042
        name: Aisha Al Mansoori
        email: aisha@example.com
        phone: '+971501234567'
        source: api
        vehicle_interest: Nissan Patrol 2025
        budget_aed: 280000
        status: HOT
        ai_score: 86
        scoring_state: SCORED
        assigned_to_id: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
        assigned_to: Omar Haddad
        external_id: CDK-LEAD-884213
        created_at: '2026-09-21T09:40:00Z'
        updated_at: '2026-09-21T09:41:12Z'
    Appointment:
      value:
        id: 6e5d4c3b-2a19-4f8e-9d7c-6b5a4f3e2d1c
        lead_id: 1042
        customer_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        inventory_id: STK-2291
        state: CONFIRMED
        channel: WHATSAPP
        starts_at: '2026-09-23T14:00:00+04:00'
        ends_at: '2026-09-23T14:45:00+04:00'
        duration_minutes: 45
        location: Al Quoz showroom
        assigned_to_id: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
        notes: Test drive, Patrol LE
        outcome_reason: null
        requested_at: '2026-09-21T09:45:00Z'
        confirmed_at: '2026-09-21T10:02:00Z'
        closed_at: null
        created_at: '2026-09-21T09:45:00Z'
        updated_at: '2026-09-21T10:02:00Z'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    Me:
      type: object
      properties:
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
        key:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            prefix:
              type: string
            scopes:
              type: array
              items:
                $ref: '#/components/schemas/Scope'
            created_at:
              type: string
              format: date-time
    Scope:
      type: string
      enum:
      - leads:read
      - leads:write
      - inventory:read
      - inventory:write
      - calls:write
      - appointments:read
    Lead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
          description: E.164 where known
        source:
          type:
          - string
          - 'null'
          description: Where NEXUS first saw the lead, e.g. api, api_call, walk_in, meta_lead_ads_facebook
        vehicle_interest:
          type:
          - string
          - 'null'
        budget_aed:
          type:
          - integer
          - 'null'
        status:
          type:
          - string
          - 'null'
          examples:
          - new
          - HOT
          - WARM
          - COLD
          - WON
          - LOST
        ai_score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        scoring_state:
          type: string
          enum:
          - PENDING
          - SCORED
          - FAILED
        assigned_to_id:
          type:
          - string
          - 'null'
          format: uuid
        assigned_to:
          type:
          - string
          - 'null'
          description: Salesperson name
        external_id:
          type:
          - string
          - 'null'
          description: Your id
          if the lead was created through this API: null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LeadCreate:
      type: object
      required:
      - name
      description: Needs `email` or `phone`.
      properties:
        external_id:
          type: string
          pattern: ^[A-Za-z0-9._:@/-]{1,200}$
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164 (UAE national numbers accepted)
        vehicle_interest:
          type: string
          maxLength: 200
        budget_aed:
          type: number
          minimum: 0
          maximum: 100000000
        notes:
          type: string
          maxLength: 2000
        source_detail:
          type: string
          maxLength: 120
          description: Free text naming the originating system or form
        occurred_at:
          type: string
          format: date-time
      anyOf:
      - required:
        - email
      - required:
        - phone
    LeadWriteResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Lead'
        created:
          type: boolean
        duplicate_of:
          type:
          - string
          - 'null'
          enum:
          - external_id
          - email
          - null
    LeadPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: string
          pattern: ^[A-Za-z][A-Za-z_ -]{0,31}$
        assigned_to_id:
          type:
          - string
          - 'null'
          format: uuid
        vehicle_interest:
          type:
          - string
          - 'null'
          maxLength: 200
        budget_aed:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100000000
        notes:
          type: string
          maxLength: 2000
          description: Appended to the lead history
    Vehicle:
      type: object
      properties:
        stock_number:
          type: string
        vin:
          type:
          - string
          - 'null'
        model:
          type: string
        status:
          type:
          - string
          - 'null'
        price_aed:
          type:
          - integer
          - 'null'
        days_in_stock:
          type:
          - integer
          - 'null'
        acquired_at:
          type:
          - string
          - 'null'
          format: date
        aging_alert:
          type:
          - string
          - 'null'
    VehicleUpsert:
      type: object
      description: Needs `stock_number` or `vin`; `model` is required when the vehicle is new.
      properties:
        stock_number:
          type: string
          pattern: ^[A-Za-z0-9._/-]{1,64}$
        vin:
          type: string
          pattern: ^[A-HJ-NPR-Z0-9]{11,17}$
        model:
          type: string
          maxLength: 120
        status:
          type: string
          maxLength: 40
          examples:
          - Available
          - Reserved
          - Sold
        price_aed:
          type:
          - number
          - 'null'
          minimum: 0
        cost_aed:
          type:
          - number
          - 'null'
          minimum: 0
          description: Write-only. Never returned by the API.
        acquired_at:
          type: string
          format: date
      anyOf:
      - required:
        - stock_number
      - required:
        - vin
    InventoryUpsertResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              stock_number:
                type:
                - string
                - 'null'
              action:
                type: string
                enum:
                - created
                - updated
                - error
              error:
                $ref: '#/components/schemas/Error/properties/error'
    CallCreate:
      type: object
      required:
      - external_call_id
      - direction
      properties:
        external_call_id:
          type: string
          pattern: ^[A-Za-z0-9._:@/-]{1,200}$
        direction:
          type: string
          enum:
          - inbound
          - outbound
        from_number:
          type: string
          description: Required for inbound (the customer)
        to_number:
          type: string
          description: Required for outbound (the customer)
        duration_sec:
          type: integer
          minimum: 0
          maximum: 86400
        started_at:
          type: string
          format: date-time
        recording_url:
          type: string
          format: uri
          pattern: ^https://
        caller_name:
          type: string
          maxLength: 200
          description: Used only if the caller becomes a new lead
    CallResult:
      type: object
      properties:
        call_id:
          type: string
          format: uuid
        lead_id:
          type: integer
        lead_created:
          type: boolean
        was_duplicate:
          type: boolean
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lead_id:
          type:
          - integer
          - 'null'
        customer_id:
          type: string
          format: uuid
        inventory_id:
          type:
          - string
          - 'null'
          description: Stock number
        state:
          type: string
          enum:
          - REQUESTED
          - OFFERED
          - CONFIRMED
          - ATTENDED
          - NO_SHOW
          - CANCELLED
        channel:
          type: string
          enum:
          - WHATSAPP
          - WEB_FORM
          - PHONE
          - WALK_IN
          - EMAIL
          - META_LEAD_AD
          - GOOGLE_LEAD_FORM
          - OTHER
        starts_at:
          type:
          - string
          - 'null'
          format: date-time
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
        duration_minutes:
          type: integer
        location:
          type:
          - string
          - 'null'
        assigned_to_id:
          type:
          - string
          - 'null'
          format: uuid
        notes:
          type:
          - string
          - 'null'
        outcome_reason:
          type:
          - string
          - 'null'
        requested_at:
          type: string
          format: date-time
        confirmed_at:
          type:
          - string
          - 'null'
          format: date-time
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEnvelope:
      type: object
      required:
      - id
      - type
      - created_at
      - tenant_id
      - data
      properties:
        id:
          type: string
          format: uuid
          description: Delivery id — deduplicate on it
        type:
          type: string
          enum:
          - lead.created
          - lead.updated
          - lead.scored
          - appointment.created
          - appointment.updated
          - message.received
          - ping
        created_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        data:
          type: object
